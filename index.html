<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali WhatsApp Sender</title>
<style>
body{font-family:Arial;background:#e5ddd5;padding:20px}
.box{background:#fff;padding:20px;border-radius:12px;max-width:400px;margin:auto;text-align:center}
.logo{width:120px;height:120px;border-radius:50%;border:4px solid #25D366}
input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{width:100%;padding:13px;margin-top:15px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<img src="ali.jpg" class="logo">
<h2>WhatsApp Sender</h2>
<div style="color:#128C7E;font-weight:bold">Ali's Method</div>
<input type="text" id="number" placeholder="03001234567">
<textarea id="msg" placeholder="Message likho"></textarea>
<button onclick="send()">WhatsApp Par Bhejo</button>
</div>
<script>
function send(){
let num=document.getElementById("number").value;
let msg=document.getElementById("msg").value;
if(num.startsWith("0")){num="92"+num.substring(1);}
window.open("wa.me"+num+"?text="+encodeURIComponent(msg),"_blank");
}
</script>
</body>
</html>
